<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
<title id="title">Barangay Estanza portal system architecture</title><desc id="desc">Browsers connect through Nginx to the Laravel application, which applies middleware, calls controllers and Eloquent models, and stores data in MySQL. Vite assets are served to the browser, and Laravel sends password reset notifications through configured mail transport.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#755238"/></marker><style>.bg{fill:#f8f5f0}.box{fill:#fff;stroke:#c49a6c;stroke-width:3}.soft{fill:#f3e9de;stroke:#c49a6c;stroke-width:2}.dark{fill:#1a0a00}.title{font:700 34px Arial,sans-serif;fill:#1a0a00}.label{font:700 22px Arial,sans-serif;fill:#1a0a00}.small{font:17px Arial,sans-serif;fill:#5b4c3d}.white{fill:#fff}.line{fill:none;stroke:#755238;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#a17a52;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}</style></defs>
<rect class="bg" width="1500" height="860"/>
<text class="title" x="70" y="78">Barangay Estanza Community Services Portal</text><text class="small" x="70" y="112">System architecture · browser, application, and data layers</text>
<rect class="box" x="70" y="210" width="260" height="150" rx="18"/><text class="label" x="200" y="260" text-anchor="middle">Resident browser</text><text class="small" x="200" y="298" text-anchor="middle">Sign-up · requests · reports</text><text class="small" x="200" y="326" text-anchor="middle">Account · announcements</text>
<rect class="box" x="70" y="500" width="260" height="150" rx="18"/><text class="label" x="200" y="550" text-anchor="middle">Staff / admin browser</text><text class="small" x="200" y="588" text-anchor="middle">Verification · review · records</text><text class="small" x="200" y="616" text-anchor="middle">Announcements · reports</text>
<rect class="soft" x="430" y="330" width="230" height="180" rx="18"/><text class="label" x="545" y="385" text-anchor="middle">Nginx</text><text class="small" x="545" y="423" text-anchor="middle">Serves static assets</text><text class="small" x="545" y="451" text-anchor="middle">Forwards PHP requests</text>
<rect class="box" x="760" y="155" width="360" height="525" rx="22"/><rect class="dark" x="760" y="155" width="360" height="74" rx="22"/><rect class="dark" x="760" y="199" width="360" height="30"/><text class="label white" x="940" y="205" text-anchor="middle">Laravel 12 application</text>
<rect class="soft" x="800" y="265" width="280" height="68" rx="12"/><text class="label" x="940" y="307" text-anchor="middle">Routes and middleware</text><text class="small" x="940" y="358" text-anchor="middle">Auth · role · verified · validation · throttle</text>
<rect class="soft" x="800" y="390" width="280" height="68" rx="12"/><text class="label" x="940" y="432" text-anchor="middle">Controllers</text><text class="small" x="940" y="484" text-anchor="middle">Accounts · requests · reports · residents</text>
<rect class="soft" x="800" y="515" width="280" height="68" rx="12"/><text class="label" x="940" y="557" text-anchor="middle">Eloquent models</text><text class="small" x="940" y="620" text-anchor="middle">Blade response returns through Nginx</text>
<rect class="box" x="1220" y="250" width="220" height="145" rx="18"/><text class="label" x="1330" y="302" text-anchor="middle">MySQL</text><text class="small" x="1330" y="340" text-anchor="middle">Users · residents</text><text class="small" x="1330" y="368" text-anchor="middle">Requests · reports · notices</text>
