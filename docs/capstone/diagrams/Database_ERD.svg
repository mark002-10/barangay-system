<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-labelledby="title desc">
<title id="title">Barangay Estanza portal database entity relationship diagram</title><desc id="desc">The ERD shows relationships among users, residents, service requests, problem reports, and announcements, including submitter, processor, and author links.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#755238"/></marker><style>.bg{fill:#f8f5f0}.card{fill:#fff;stroke:#c49a6c;stroke-width:2.5}.head{fill:#1a0a00}.ht{font:700 22px Arial,sans-serif;fill:#fff}.txt{font:16px Arial,sans-serif;fill:#35261a}.meta{font:14px Arial,sans-serif;fill:#785b40}.title{font:700 34px Arial,sans-serif;fill:#1a0a00}.line{fill:none;stroke:#755238;stroke-width:2.5;marker-end:url(#arr)}.edge{font:15px Arial,sans-serif;fill:#755238;font-weight:bold}</style></defs>
<rect class="bg" width="1700" height="1120"/><text class="title" x="60" y="68">Barangay Estanza portal · database ERD</text><text class="meta" x="60" y="100">Domain tables and foreign-key relationships · framework infrastructure tables omitted</text>
<!-- users -->
<rect class="card" x="70" y="160" width="370" height="390" rx="12"/><path class="head" d="M82 160h346a12 12 0 0 1 12 12v44H70v-44a12 12 0 0 1 12-12Z"/><text class="ht" x="95" y="196">users</text><text class="txt" x="96" y="240">PK id</text><text class="txt" x="96" y="270">UK email · name · password</text><text class="txt" x="96" y="300">role · is_verified</text><text class="txt" x="96" y="330">first_name · middle_name · last_name</text><text class="txt" x="96" y="360">birth_date · gender · civil_status</text><text class="txt" x="96" y="390">purok · address · phone</text><text class="txt" x="96" y="420">FK resident_id (nullable)</text><text class="txt" x="96" y="450">verified_at · timestamps</text><text class="meta" x="96" y="500">Authentication and resident profile</text>
<!-- residents -->
<rect class="card" x="620" y="145" width="390" height="420" rx="12"/><path class="head" d="M632 145h366a12 12 0 0 1 12 12v44H620v-44a12 12 0 0 1 12-12Z"/><text class="ht" x="645" y="181">residents</text><text class="txt" x="646" y="226">PK id</text><text class="txt" x="646" y="256">first_name · middle_name · last_name · suffix</text><text class="txt" x="646" y="286">birth_date · gender · civil_status</text><text class="txt" x="646" y="316">purok · address · phone</text><text class="txt" x="646" y="346">is_active · timestamps · deleted_at</text><text class="meta" x="646" y="398">Barangay resident record</text>
<!-- service -->
<rect class="card" x="1180" y="145" width="450" height="450" rx="12"/><path class="head" d="M1192 145h426a12 12 0 0 1 12 12v44h-450v-44a12 12 0 0 1 12-12Z"/><text class="ht" x="1205" y="181">service_requests</text><text class="txt" x="1206" y="226">PK id · FK resident_id (nullable)</text><text class="txt" x="1206" y="256">FK requester_id (nullable)</text><text class="txt" x="1206" y="286">FK processed_by (nullable)</text><text class="txt" x="1206" y="316">requester_name · requester_email</text><text class="txt" x="1206" y="346">requester_phone · requester_address</text><text class="txt" x="1206" y="376">request_type · purpose · status</text><text class="txt" x="1206" y="406">staff_notes · processed_at</text><text class="txt" x="1206" y="436">timestamps · deleted_at</text><text class="meta" x="1206" y="486">Certificate request and review record</text>
<!-- reports -->
<rect class="card" x="620" y="690" width="450" height="380" rx="12"/><path class="head" d="M632 690h426a12 12 0 0 1 12 12v44H620v-44a12 12 0 0 1 12-12Z"/><text class="ht" x="645" y="726">problem_reports</text><text class="txt" x="646" y="770">PK id · FK user_id (nullable)</text><text class="txt" x="646" y="800">FK processed_by (nullable)</text><text class="txt" x="646" y="830">reporter_name · reporter_email · phone</text><text class="txt" x="646" y="860">category · subject · description · location</text><text class="txt" x="646" y="890">status · staff_notes · processed_at</text><text class="txt" x="646" y="920">timestamps · deleted_at</text><text class="meta" x="646" y="970">Community issue and handling record</text>
<!-- announcement -->
<rect class="card" x="1200" y="745" width="370" height="280" rx="12"/><path class="head" d="M1212 745h346a12 12 0 0 1 12 12v44h-370v-44a12 12 0 0 1 12-12Z"/><text class="ht" x="1225" y="781">announcements</text><text class="txt" x="1226" y="825">PK id · FK created_by (nullable)</text><text class="txt" x="1226" y="855">title · body</text><text class="txt" x="1226" y="885">published_at · timestamps</text><text class="meta" x="1226" y="940">Community notices</text>
<!-- relationships -->
<path class="line" d="M440 230 H610"/><text class="edge" x="470" y="215">resident_id</text><text class="edge" x="480" y="255">0..1 ↔ 0..*</text>
<path class="line" d="M1010 270 H1170"/><text class="edge" x="1030" y="255">resident_id</text>
<path class="line" d="M440 330 H540 V625 H1420 V605"/><text class="edge" x="1000" y="610">requester_id</text>
<path class="line" d="M440 380 H510 V650 H1120 V360 H1170"/><text class="edge" x="880" y="642">processed_by</text>
<path class="line" d="M440 450 H570 V850 H610"/><text class="edge" x="470" y="470">user_id</text>
<path class="line" d="M440 520 H530 V660 H1150 V845 H1190"/><text class="edge" x="1080" y="644">created_by</text>
<path class="line" d="M440 400 H520 V760 H610"/><text class="edge" x="465" y="738">processed_by</text>
</svg>
